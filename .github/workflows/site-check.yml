name: Site smoke check
on:
  pull_request:
    paths:
      - 'index.html'
      - 'resources/css/workbench.css'
      - 'resources/js/workbench.js'
      - 'resources/css/spotify.css'
      - 'resources/js/spotify.js'
      - 'scripts/update_spotify.py'
      - 'scripts/authorize_spotify.py'
      - 'tests/test_spotify.py'
      - '.github/workflows/spotify-snapshot.yml'
      - '.github/workflows/site-check.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate HTML structure and JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re, subprocess
          content=Path("index.html").read_text()
          class Inspector(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids=set()
                  self.duplicates=[]
                  self.links=[]
                  self.images=[]
              def handle_starttag(self, tag, attrs):
                  attrs=dict(attrs)
                  if 'id' in attrs:
                      if attrs['id'] in self.ids:self.duplicates.append(attrs['id'])
                      self.ids.add(attrs['id'])
                  if tag=='a':self.links.append(attrs.get('href',''))
                  if tag=='img':self.images.append(attrs)
          doc=Inspector()
          doc.feed(content)
          assert not doc.duplicates, f"Duplicate IDs: {doc.duplicates}"
          assert '<meta name="viewport"' in content, "Missing viewport"
          assert '<title>' in content, "Missing title"
          assert all(link.startswith(('#','https://','mailto:')) for link in doc.links), "Invalid link scheme"
          assert all(not link.startswith('#') or link[1:] in doc.ids for link in doc.links), "Broken fragment links"
          assert all('alt' in img for img in doc.images), "Image missing alt text"
          scripts=re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',content,re.S|re.I)
          assert scripts, "Missing interactive script"
          Path('/tmp/site.js').write_text('\\n'.join(scripts))
          subprocess.run(['node','--check','/tmp/site.js'],check=True)
          assert Path("resources/css/workbench.css").is_file(), "Missing workbench stylesheet"
          assert Path("resources/js/workbench.js").is_file(), "Missing workbench script"
          assert 'id="live-workbench"' in content, "Missing workbench section"
          assert Path("resources/css/spotify.css").is_file(), "Missing Spotify stylesheet"
          assert Path("resources/js/spotify.js").is_file(), "Missing Spotify script"
          assert 'id="spotify-now-playing"' in content, "Missing Spotify panel"
          print(f"HTML smoke checks passed: {len(doc.ids)} IDs, {len(doc.links)} links")
          PY
      - name: Check external workbench JavaScript
        run: node --check resources/js/workbench.js
      - name: Check Spotify JavaScript syntax
        run: node --check resources/js/spotify.js
      - name: Check Spotify Python and sanitization tests
        run: |
          python -m py_compile scripts/update_spotify.py scripts/authorize_spotify.py
          python -m unittest discover -s tests -p 'test_spotify.py' -v
